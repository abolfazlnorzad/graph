server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Container stdout/stderr logs (Docker driver)
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
    pipeline_stages:
      - docker: {}
      # Parse JSON logs from the Go app
      - match:
          selector: '{service="app"}'
          stages:
            - json:
                expressions:
                  level: level
                  msg: msg
                  op: op
                  trace_id: trace_id
                  span_id: span_id
            - labels:
                level:
                op:
            - timestamp:
                source: time
                format: RFC3339Nano
                fallback_formats:
                  - RFC3339
                  - "2006-01-02T15:04:05.000000000Z"
                  - "2006-01-02T15:04:05Z07:00"

  # App log file (if mounted as volume)
  - job_name: app-file
    static_configs:
      - targets:
          - localhost
        labels:
          job: app
          logstream: file
          __path__: /var/log/app/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            msg: msg
            op: op
            trace_id: trace_id
            span_id: span_id
      - labels:
          level:
          op:
      - timestamp:
          source: time
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
            - "2006-01-02T15:04:05.000000000Z"
            - "2006-01-02T15:04:05Z07:00"
