version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: graph-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: graph
      POSTGRES_PASSWORD: graph
      POSTGRES_DB: graph_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - graph-pg-data:/var/lib/postgresql
    networks:
      - graph-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graph -d graph_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  graph-pg-data:

networks:
  graph-network:
    driver: bridge