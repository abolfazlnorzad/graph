http_server:
  port: 8080

logger:
  level: info
  file_path: logs/app.log
  use_local_time: true
  file_max_size_in_mb: 100
  file_max_age_in_days: 7

metric:
  enabled: true
  exporter: "prometheus"
  service_name: "graph"

trace:
  enabled: true
  exporter: "otlp"
  endpoint: "localhost:4317"
  service_name: "graph"
  sample_rate: 1.0
  timeout: 5s

postgres:
  host: localhost
  port: 5432
  user: graph
  password: graph
  db_name: graph_db
  ssl_mode: disable
  max_conns: 10
  min_conns: 2
  max_conn_lifetime: 3600
  max_conn_idle_time: 600
  health_check_period: 30

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
